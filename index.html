<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Siswa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" id="loginArea">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="text-center mb-4">Login LMS</h4>
                    <input type="text" id="idSiswa" class="form-control mb-3" placeholder="ID Siswa">
                    <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                    <button class="btn btn-primary w-100" onclick="login()">Masuk</button>
                    <p id="msg" class="text-danger mt-2 text-center"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-5 d-none" id="dashboardArea">
    <h3>Selamat Datang, <span id="namaSiswa"></span>!</h3>
    <hr>
    <!-- Komponen Dashboard lainnya (Tugas, Upload, dll) -->
<div class="container mt-5 d-none" id="dashboardArea">
    <h3>Selamat Datang, <span id="namaSiswa"></span>!</h3>
    <hr>
    
    <!-- Wadah Tabel Tugas -->
    <h5 class="mt-4">Daftar Tugas Anda</h5>
    <div class="table-responsive">
        <table class="table table-bordered table-striped mt-2">
            <thead class="table-dark">
                <tr>
                    <th>Judul Tugas</th>
                    <th>Deskripsi</th>
                    <th>Deadline</th>
                </tr>
            </thead>
            <tbody id="tabelTugas">
                <tr><td colspan="3" class="text-center">Memuat tugas...</td></tr>
            </tbody>
        </table>
    </div>

    <button class="btn btn-danger mt-3" onclick="logout()">Logout</button>
</div>
    
    <button class="btn btn-danger" onclick="logout()">Logout</button>
</div>

<script>
    // URL Web App GAS Anda
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUiyCqxxGBhIjqetTmrKE5rf6wxPN_d05kvnUqkI4SNXVnm05S_Gc-AFHTezCltwsV/exec";

    async function login() {
        const idSiswa = document.getElementById("idSiswa").value;
        const password = document.getElementById("password").value;
        const msg = document.getElementById("msg");

        msg.innerHTML = "Memeriksa...";

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", username: idSiswa, password: password })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById("loginArea").classList.add("d-none");
                document.getElementById("dashboardArea").classList.remove("d-none");
                document.getElementById("namaSiswa").innerText = result.user.nama;
                
                // Simpan sesi di LocalStorage
                localStorage.setItem("user", JSON.stringify(result.user));
            } else {
                msg.innerHTML = result.message;
            }
        } catch (error) {
            msg.innerHTML = "Terjadi kesalahan koneksi.";
        }
    }

    function logout() {
        localStorage.removeItem("user");
        location.reload();
    }

    // Panggil muatTugas() begitu siswa berhasil login
async function muatTugas() {
    const tabel = document.getElementById("tabelTugas");
    
    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "getTugas" })
        });
        const result = await response.json();

        if (result.status === "success") {
            tabel.innerHTML = "";
            if (result.tugas.length === 0) {
                tabel.innerHTML = '<tr><td colspan="3" class="text-center">Belum ada tugas.</td></tr>';
                return;
            }

            result.tugas.forEach(t => {
                tabel.innerHTML += `
                    <tr>
                        <td><strong>${t.judul}</strong></td>
                        <td>${t.deskripsi}</td>
                        <td><span class="badge bg-warning text-dark">${t.deadline}</span></td>
                    </tr>
                `;
            });
        }
    } catch (error) {
        tabel.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Gagal memuat tugas.</td></tr>';
    }
}
</script>

</body>
</html>
