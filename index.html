<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Siswa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- AREA LOGIN -->
<div class="container mt-5" id="loginArea">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="text-center mb-4">Login LMS</h4>
                    <input type="text" id="idSiswa" class="form-control mb-3" placeholder="ID Siswa">
                    <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                    <button class="btn btn-primary w-100" onclick="login()">Masuk</button>
                    <p id="msg" class="text-danger mt-2 text-center"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- AREA DASHBOARD SISWA -->
<div class="container mt-5 d-none" id="dashboardArea">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Selamat Datang, <span id="namaSiswa"></span>!</h3>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
    <hr>
    
    <!-- TABEL DAFTAR TUGAS -->
    <h5 class="mt-4">Daftar Tugas</h5>
    <div class="table-responsive">
        <table class="table table-bordered table-striped mt-2">
            <thead class="table-dark">
                <tr>
                    <th>ID Tugas</th>
                    <th>Judul Tugas</th>
                    <th>Deskripsi</th>
                    <th>Deadline</th>
                </tr>
            </thead>
            <tbody id="tabelTugas">
                <tr><td colspan="4" class="text-center">Memuat tugas...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzrVr8PS057ufiG7bEIyE9pdRN54Od2d2MijboXYToluWjlJKb8leVGqkWKprqp854-/exec";

    async function login() {
        const idSiswa = document.getElementById("idSiswa").value;
        const password = document.getElementById("password").value;
        const msg = document.getElementById("msg");

        if (!idSiswa || !password) {
            msg.innerHTML = "Isi ID dan Password!";
            return;
        }

        msg.innerHTML = "Memeriksa...";

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", username: idSiswa, password: password })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById("loginArea").classList.add("d-none");
                document.getElementById("dashboardArea").classList.remove("d-none");
                document.getElementById("namaSiswa").innerText = result.user.nama;
                
                // Panggil fungsi untuk mengambil daftar tugas
                muatTugas();
            } else {
                msg.innerHTML = result.message;
            }
        } catch (error) {
            msg.innerHTML = "Terjadi kesalahan koneksi.";
        }
    }

    async function muatTugas() {
        const tabel = document.getElementById("tabelTugas");
        tabel.innerHTML = '<tr><td colspan="4" class="text-center">Memuat data dari Spreadsheet...</td></tr>';
        
        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getTugas" })
            });
            const result = await response.json();

            if (result.status === "success") {
                tabel.innerHTML = "";
                if (result.tugas.length === 0) {
                    tabel.innerHTML = '<tr><td colspan="4" class="text-center">Belum ada tugas.</td></tr>';
                    return;
                }

                result.tugas.forEach(t => {
                    tabel.innerHTML += `
                        <tr>
                            <td>${t.idTugas}</td>
                            <td><strong>${t.judul}</strong></td>
                            <td>${t.deskripsi}</td>
                            <td><span class="badge bg-warning text-dark">${t.deadline}</span></td>
                        </tr>
                    `;
                });
            } else {
                tabel.innerHTML = `<tr><td colspan="4" class="text-center text-danger">${result.message}</td></tr>`;
            }
        } catch (error) {
            tabel.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Gagal memuat tugas dari server.</td></tr>';
        }
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
