<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Siswa Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Gradient background yang lebih dinamis */
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Styling Card Login */
        .card-login {
            border: none;
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #64748b;
        }

        .form-control {
            border-left: none;
            background-color: #f8fafc;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: #ffffff;
            box-shadow: none;
            border-color: #dee2e6;
        }

        /* Styling Tombol Kustom */
        .btn-custom {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 50rem; /* Pill shape */
            transition: all 0.2s ease;
        }

        .btn-primary-custom {
            background-color: #4f46e5;
            border: none;
            color: white;
        }

        .btn-primary-custom:hover {
            background-color: #4338ca;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-primary-custom:active, .btn-action:active {
            transform: scale(0.98);
        }

        .btn-ujian {
            background-color: #10b981;
            border: none;
            color: white;
        }

        .btn-ujian:hover {
            background-color: #059669;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }

        /* Dashboard Container */
        .dashboard-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Table Hover Animation */
        .table-hover tbody tr {
            transition: all 0.2s ease;
        }
        .table-hover tbody tr:hover {
            background-color: #f8fafc;
            transform: scale(1.01);
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container py-5" id="loginArea">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card card-login p-4 p-sm-5 fade-in">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow" style="width: 65px; height: 65px;">
                        <i class="bi bi-mortarboard-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">LMS Siswa</h3>
                    <p class="text-muted small">Silakan masuk ke akun Anda</p>
                </div>

                <form onsubmit="event.preventDefault(); login();">
                    <div class="mb-3">
                        <label for="idSiswa" class="form-label small text-muted fw-semibold">ID SISWA</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="idSiswa" class="form-control" placeholder="Masukkan ID Siswa" required autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small text-muted fw-semibold">PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required autocomplete="current-password">
                            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button class="btn btn-custom btn-primary-custom w-100 mb-3" id="btnLogin" type="submit">
                        <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Masuk</span>
                    </button>

                    <div id="msg" class="text-danger small text-center fw-medium" style="min-height: 24px;"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container py-5 d-none fade-in" id="dashboardArea">
    <div class="dashboard-container p-4 p-md-5">
        
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4 mb-4">
            <div class="d-flex align-items-center gap-3 w-100 w-md-auto justify-content-center justify-content-md-start">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 56px; height: 56px;">
                    <i class="bi bi-person-circle fs-2"></i>
                </div>
                <div class="text-center text-md-start">
                    <h4 class="fw-bold mb-0">Halo, <span id="namaSiswa" class="text-primary"></span>!</h4>
                    <small class="text-muted">Panel Tugas & Pembelajaran</small>
                </div>
            </div>
            
            <div class="d-flex gap-2 w-100 w-md-auto justify-content-center justify-content-md-end">
                <a href="https://herrypermana.github.io/KTSM8/ujian.html" target="_blank" class="btn btn-custom btn-ujian d-flex align-items-center">
                    <i class="bi bi-laptop me-2"></i> Ruang Ujian
                </a>
                
                <button class="btn btn-custom btn-outline-danger d-flex align-items-center" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>

        <hr class="text-secondary opacity-25">

        <div class="mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0"><i class="bi bi-journal-bookmark me-2 text-primary"></i>Daftar Tugas Anda</h5>
            </div>
            <div class="table-responsive rounded-4 border shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="py-3 px-4">ID Tugas</th>
                            <th scope="col" class="py-3">Judul Tugas</th>
                            <th scope="col" class="py-3">Deskripsi</th>
                            <th scope="col" class="py-3 text-center px-4">Deadline</th>
                        </tr>
                    </thead>
                    <tbody id="tabelTugas">
                        <tr>
                            <td colspan="4" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm me-2 text-primary" role="status"></div>
                                Memuat tugas...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzrVr8PS057ufiG7bEIyE9pdRN54Od2d2MijboXYToluWjlJKb8leVGqkWKprqp854-/exec";

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("bi-eye");
            toggleIcon.classList.add("bi-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("bi-eye-slash");
            toggleIcon.classList.add("bi-eye");
        }
    }

    async function login() {
        const idSiswa = document.getElementById("idSiswa").value.trim();
        const password = document.getElementById("password").value.trim();
        const msg = document.getElementById("msg");
        const btnLogin = document.getElementById("btnLogin");
        const btnText = document.getElementById("btnText");

        if (!idSiswa || !password) {
            msg.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i>Isi ID dan Password!';
            return;
        }

        // Set state loading pada tombol
        btnLogin.disabled = true;
        btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Memeriksa...';
        msg.innerHTML = "";

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", username: idSiswa, password: password })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById("loginArea").classList.add("d-none");
                document.getElementById("dashboardArea").classList.remove("d-none");
                document.getElementById("namaSiswa").innerText = result.user.nama;
                muatTugas();
            } else {
                msg.innerHTML = `<i class="bi bi-x-circle me-1"></i>${result.message}`;
            }
        } catch (error) {
            msg.innerHTML = '<i class="bi bi-wifi-off me-1"></i>Terjadi kesalahan koneksi.';
        } finally {
            // Mengembalikan tombol ke kondisi awal
            btnLogin.disabled = false;
            btnText.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
        }
    }

    async function muatTugas() {
        const tabel = document.getElementById("tabelTugas");
        tabel.innerHTML = `
            <tr>
                <td colspan="4" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm me-2 text-primary" role="status"></div>
                    Memuat data dari Spreadsheet...
                </td>
            </tr>`;

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getTugas" })
            });
            const result = await response.json();

            if (result.status === "success") {
                tabel.innerHTML = "";
                if (result.tugas.length === 0) {
                    tabel.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Belum ada tugas. Hore!</td></tr>';
                    return;
                }

                result.tugas.forEach(t => {
                    tabel.innerHTML += `
                        <tr>
                            <td class="px-4"><span class="fw-bold text-primary">#${t.idTugas}</span></td>
                            <td><strong class="text-dark">${t.judul}</strong></td>
                            <td class="text-muted">${t.deskripsi}</td>
                            <td class="text-center px-4"><span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle px-3 py-2 rounded-pill"><i class="bi bi-clock me-1"></i> ${t.deadline}</span></td>
                        </tr>
                    `;
                });
            } else {
                tabel.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>${result.message}</td></tr>`;
            }
        } catch (error) {
            tabel.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4"><i class="bi bi-wifi-off me-2"></i>Gagal memuat tugas dari server.</td></tr>';
        }
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
