<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online LMS - Siswa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Proteksi dasar dari seleksi teks */
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Floating status bar */
        .warning-box { 
            position: fixed; 
            top: 15px; 
            right: 20px; 
            z-index: 9999; 
            display: flex;
            gap: 10px;
        }

        .card {
            border-radius: 0.75rem;
            border: none;
        }

        .no-drag {
            -webkit-user-drag: none;
            user-drag: none;
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

<!-- Header Status & Timer (Floating) -->
<div class="warning-box d-none" id="statusHeader">
    <span class="badge bg-danger fs-6 px-3 py-2 shadow-sm" id="timer">
        <i class="bi bi-clock me-1"></i> Waktu: --:--
    </span>
    <span class="badge bg-warning text-dark fs-6 px-3 py-2 shadow-sm" id="pelanggaranBadge">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> Pelanggaran: 0/3
    </span>
</div>

<!-- 1. TAMPILAN LOGIN SISWA -->
<div class="container mt-5" id="loginArea" style="max-width: 420px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-person-lock me-2"></i>Login Ujian Siswa</h4>
        </div>
        <div class="card-body p-4">
            <form id="formLogin" onsubmit="prosesLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold">ID Siswa / NIS</label>
                    <input type="text" id="inputUsername" class="form-control" placeholder="Masukkan ID Siswa" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="inputPassword" class="form-control" placeholder="Masukkan Password" required>
                </div>
                <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Ujian
                </button>
            </form>
            <div id="loginMsg" class="mt-3 text-center fw-semibold small"></div>
        </div>
    </div>
</div>

<!-- 2. TAMPILAN PILIH MAPEL -->
<div class="container mt-5 d-none" id="pilihMapelArea" style="max-width: 480px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <div class="text-center mb-3">
                <i class="bi bi-journal-bookmark-fill text-primary fs-1"></i>
                <h4 class="card-title fw-bold mt-2">Pilih Mata Pelajaran</h4>
                <p class="text-muted small" id="infoSiswa">Selamat Datang</p>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Mata Pelajaran Ujian</label>
                <select id="selectMapelUjian" class="form-select">
                    <option value="">Memuat daftar mapel...</option>
                </select>
            </div>
            <button class="btn btn-success w-100 py-2 fw-bold" onclick="mulaiUjian()">
                <i class="bi bi-play-circle me-1"></i> Mulai Ujian Sekarang
            </button>
        </div>
    </div>
</div>

<!-- 3. TAMPILAN SOAL UJIAN -->
<div class="container mt-4 mb-5 d-none" id="areaUjian">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold" id="judulMapel"><i class="bi bi-file-earmark-text me-2"></i>Ujian Online</h5>
            <button class="btn btn-sm btn-light fw-bold" onclick="mintaFullscreen()">
                <i class="bi bi-arrows-fullscreen me-1"></i> Mode Fullscreen
            </button>
        </div>
        <div class="card-body p-4">
            <div id="containerSoal">Memuat soal...</div>
            <hr class="my-4">
            <button class="btn btn-success btn-lg w-100 fw-bold shadow-sm" id="btnKumpulkan" onclick="kumpulkanUjianConfirm()">
                <i class="bi bi-send-check me-1"></i> Kumpulkan Jawaban
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwLFOXaK8vNAN3AmSujH0OWSliuoyAveOm3tKEfxSHCKik6AQzetujjWMkJjwAzEcA/exec";

    let currentUser = null;
    let dataSoalGlobal = [];
    let jumlahPelanggaran = 0;
    let sisaWaktu = 3600;
    let timerInterval;
    let selectedMapelId = "";
    let isExamFinished = false;

    // --- PROSES LOGIN ---
    async function prosesLogin(e) {
        e.preventDefault();
        const btn = document.getElementById("btnLogin");
        const msg = document.getElementById("loginMsg");
        const username = document.getElementById("inputUsername").value.trim();
        const password = document.getElementById("inputPassword").value.trim();

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa...';
        msg.innerHTML = '';

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "login",
                    username: username,
                    password: password
                })
            });
            const data = await res.json();

            if (data.status === "success") {
                currentUser = data.user;
                document.getElementById("loginArea").classList.add("d-none");
                document.getElementById("pilihMapelArea").classList.remove("d-none");
                document.getElementById("infoSiswa").innerText = `Siswa: ${currentUser.nama} (${currentUser.kelas})`;
                loadMapelUjian();
            } else {
                msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${data.message}</span>`;
            }
        } catch (err) {
            msg.innerHTML = '<span class="text-danger"><i class="bi bi-wifi-off me-1"></i>Gagal menghubungi server.</span>';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk Ujian';
        }
    }

    // --- LOAD MAPEL ---
    async function loadMapelUjian() {
        const select = document.getElementById("selectMapelUjian");
        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getMapel" })
            });
            const data = await res.json();
            if (data.status === "success") {
                select.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
                data.mapel.forEach(m => {
                    select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel}</option>`;
                });
            }
        } catch (e) {
            select.innerHTML = '<option value="">Gagal memuat mapel</option>';
        }
    }

    // --- PROTEKSI & SISTEM ANTI-CHEATING ---
    function aktifkanAntiCheating() {
        // 1. Blokir Klik Kanan, Copy, Paste, Cut, Drag
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // 2. Blokir Tombol Shortcut Developer Tools & Inspeksi
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.key === 'a' || e.key === 'A'))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        // 3. Deteksi Perpindahan Tab / Buka Browser Lain
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && !isExamFinished) {
                catatPelanggaran("Dilarang berpindah tab atau meninggalkan browser!");
            }
        });

        // 4. Deteksi Kehilangan Fokus Window (Split Screen / Buka Aplikasi Lain)
        window.addEventListener("blur", () => {
            if (!isExamFinished) {
                catatPelanggaran("Dilarang mengaktifkan jendela/aplikasi di luar area ujian!");
            }
        });

        // 5. Deteksi Keluar Dari Mode Fullscreen
        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement && !isExamFinished) {
                catatPelanggaran("Dilarang keluar dari mode Layar Penuh (Fullscreen)!");
            }
        });

        // 6. Cegah Refresh / Tutup Halaman Secara Tidak Sengaja
        window.addEventListener("beforeunload", (e) => {
            if (!isExamFinished) {
                e.preventDefault();
                e.returnValue = "Ujian sedang berlangsung. Jawaban Anda mungkin hilang jika Anda menyegarkan halaman!";
            }
        });
    }

    function catatPelanggaran(pesan) {
        if (isExamFinished) return;

        jumlahPelanggaran++;
        document.getElementById("pelanggaranBadge").innerText = `Pelanggaran: ${jumlahPelanggaran}/3`;
        
        if (jumlahPelanggaran >= 3) {
            alert(`Peringatan Terakhir (${jumlahPelanggaran}/3): ${pesan}\n\nBatas pelanggaran telah terlampaui. Jawaban Anda akan dikumpulkan secara otomatis!`);
            kumpulkanUjian();
        } else {
            alert(`PERINGATAN KECURANGAN (${jumlahPelanggaran}/3):\n${pesan}\n\nJika mencapai 3 kali pelanggaran, ujian akan dikumpulkan otomatis!`);
            mintaFullscreen();
        }
    }

    function mintaFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }

    function jalankanTimer() {
        timerInterval = setInterval(() => {
            if (isExamFinished) return;
            sisaWaktu--;
            let m = Math.floor(sisaWaktu / 60);
            let s = sisaWaktu % 60;
            document.getElementById("timer").innerHTML = `<i class="bi bi-clock me-1"></i> Waktu: ${m}:${s < 10 ? '0' : ''}${s}`;
            
            if (sisaWaktu <= 0) {
                clearInterval(timerInterval);
                alert("Waktu ujian telah habis! Jawaban Anda akan langsung dikumpulkan.");
                kumpulkanUjian();
            }
        }, 1000);
    }

    // --- MULAI UJIAN ---
    async function mulaiUjian() {
        const select = document.getElementById("selectMapelUjian");
        selectedMapelId = select.value;
        if (!selectedMapelId) {
            alert("Silakan pilih Mata Pelajaran terlebih dahulu!");
            return;
        }

        document.getElementById("pilihMapelArea").classList.add("d-none");
        document.getElementById("areaUjian").classList.remove("d-none");
        document.getElementById("statusHeader").classList.remove("d-none");
        document.getElementById("judulMapel").innerText = `Ujian: ${select.options[select.selectedIndex].text}`;

        mintaFullscreen();
        aktifkanAntiCheating();

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getSoal", idMapel: selectedMapelId })
            });
            const data = await res.json();
            if (data.status === "success" && data.soal.length > 0) {
                dataSoalGlobal = data.soal;
                renderSoal(data.soal);
                jalankanTimer();
            } else {
                document.getElementById("containerSoal").innerHTML = '<div class="alert alert-warning text-center">Belum ada soal untuk mata pelajaran ini.</div>';
            }
        } catch (e) {
            document.getElementById("containerSoal").innerHTML = '<div class="alert alert-danger text-center">Gagal memuat data soal dari server.</div>';
        }
    }

    // --- RENDER SOAL ---
    function renderSoal(soalArray) {
        let html = "";
        soalArray.forEach((s, i) => {
            html += `<div class="mb-4 p-4 border rounded bg-white shadow-sm">`;
            html += `<p class="fw-bold fs-5 text-dark mb-3">${i + 1}. ${s.pertanyaan}</p>`;

            if (s.tipe === "PG_SEDERHANA") {
                s.opsi.forEach((o, oIdx) => {
                    html += `
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="soal_${s.idSoal}" id="opt_${s.idSoal}_${oIdx}" value="${o}">
                            <label class="form-check-label fs-6" for="opt_${s.idSoal}_${oIdx}">${o}</label>
                        </div>`;
                });
            } else if (s.tipe === "PGK_MCMA") {
                s.opsi.forEach((o, oIdx) => {
                    html += `
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="soal_${s.idSoal}" id="opt_${s.idSoal}_${oIdx}" value="${o}">
                            <label class="form-check-label fs-6" for="opt_${s.idSoal}_${oIdx}">${o}</label>
                        </div>`;
                });
            } else if (s.tipe === "PGK_KATEGORI") {
                html += `
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle mt-2">
                            <thead class="table-light">
                                <tr>
                                    <th>Pernyataan</th>
                                    <th width="100" class="text-center">Benar</th>
                                    <th width="100" class="text-center">Salah</th>
                                </tr>
                            </thead>
                            <tbody>`;
                s.opsi.forEach((p, pIdx) => {
                    html += `
                        <tr>
                            <td>${p}</td>
                            <td class="text-center"><input type="radio" name="soal_${s.idSoal}_${pIdx}" value="Benar"></td>
                            <td class="text-center"><input type="radio" name="soal_${s.idSoal}_${pIdx}" value="Salah"></td>
                        </tr>`;
                });
                html += `</tbody></table></div>`;
            }
            html += `</div>`;
        });
        document.getElementById("containerSoal").innerHTML = html;
    }

    function kumpulkanUjianConfirm() {
        if (confirm("Apakah Anda yakin ingin mengumpulkan ujian sekarang?")) {
            kumpulkanUjian();
        }
    }

    // --- SUBMIT UJIAN ---
    async function kumpulkanUjian() {
        if (isExamFinished) return;
        isExamFinished = true; 

        clearInterval(timerInterval);

        const btnKumpulkan = document.getElementById("btnKumpulkan");
        if(btnKumpulkan) {
            btnKumpulkan.disabled = true;
            btnKumpulkan.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mengirim Jawaban...';
        }

        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        }

        let jawabanList = [];

        dataSoalGlobal.forEach(s => {
            if (s.tipe === "PG_SEDERHANA") {
                let el = document.querySelector(`input[name="soal_${s.idSoal}"]:checked`);
                jawabanList.push({ idSoal: s.idSoal, jawaban: el ? el.value : "" });
            } else if (s.tipe === "PGK_MCMA") {
                let els = document.querySelectorAll(`input[name="soal_${s.idSoal}"]:checked`);
                jawabanList.push({ idSoal: s.idSoal, jawaban: Array.from(els).map(e => e.value) });
            } else if (s.tipe === "PGK_KATEGORI") {
                let katObj = {};
                s.opsi.forEach((p, pIdx) => {
                    let el = document.querySelector(`input[name="soal_${s.idSoal}_${pIdx}"]:checked`);
                    katObj[p] = el ? el.value : "";
                });
                jawabanList.push({ idSoal: s.idSoal, jawaban: katObj });
            }
        });

        document.getElementById("containerSoal").innerHTML = `
            <div class="text-center py-5">
                <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                <h5 class="fw-bold">Sedang memproses dan menyimpan nilai Anda...</h5>
            </div>`;

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "submitUjian",
                    idSiswa: currentUser ? currentUser.id : "GUEST",
                    idMapel: selectedMapelId,
                    jawaban: jawabanList,
                    pelanggaran: jumlahPelanggaran
                })
            });
            const data = await res.json();
            if (data.status === "success") {
                alert(`Ujian Selesai!\nNilai Anda: ${data.nilai}`);
                window.location.reload();
            } else {
                alert(`Terjadi kesalahan: ${data.message}`);
            }
        } catch (e) {
            alert("Gagal mengirim jawaban. Pastikan koneksi internet Anda stabil.");
        }
    }
</script>
</body>
</html>
