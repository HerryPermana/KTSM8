<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal LMS - Guru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 750px;">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0" id="formTitle">Form Kelola Soal</h4>
            <button class="btn btn-sm btn-light" id="btnResetForm" onclick="resetFormToTambah()">+ Tambah Soal Baru</button>
        </div>
        <div class="card-body">
            
            <!-- Pilih Mapel -->
            <div class="mb-3">
                <label class="form-label font-weight-bold">Pilih Mata Pelajaran</label>
                <select id="selectMapel" class="form-select" onchange="loadDaftarSoal()" required>
                    <option value="">Memuat Mapel...</option>
                </select>
            </div>

            <!-- Pilih Soal yang Sudah Ada untuk Di-edit -->
            <div class="mb-3 p-3 bg-white border rounded">
                <label class="form-label font-weight-bold text-primary">Lihat & Edit Soal Tersedia</label>
                <select id="selectSoalAda" class="form-select" onchange="pilihSoalUntukEdit()" disabled>
                    <option value="">Pilih Mapel terlebih dahulu...</option>
                </select>
            </div>

            <hr>

            <!-- Form Input / Edit Soal -->
            <form id="formSoal" onsubmit="simpanSoal(event)">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">ID Soal</label>
                    <input type="text" id="idSoal" class="form-control" placeholder="Contoh: S1, S2, S3" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Tipe Soal</label>
                    <select id="tipeSoal" class="form-select" onchange="ubahTipeSoal()" required>
                        <option value="PG_SEDERHANA">Pilihan Ganda Sederhana (1 Jawaban Benar)</option>
                        <option value="PGK_MCMA">PGK MCMA (Bisa Lebih Dari 1 Jawaban Benar)</option>
                        <option value="PGK_KATEGORI">PGK Kategori (Pernyataan Benar / Salah)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Pertanyaan / Pokok Soal</label>
                    <textarea id="pertanyaan" class="form-control" rows="3" placeholder="Tuliskan pertanyaan..." required></textarea>
                </div>

                <div id="areaOpsi"></div>

                <button type="submit" id="btnSimpan" class="btn btn-success w-100 mt-4">Simpan Soal Baru</button>
            </form>
            <div id="statusMsg" class="mt-3 text-center"></div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxWaueTt2s1Mt_S8eI1QeaZKOvf8dS_khQRPVPzKTqPfmCYMgcP3Qcv_obHFyPW5Yza/exec";

    let listSoalLoaded = [];
    let isEditMode = false;

    async function loadMapel() {
        const select = document.getElementById("selectMapel");
        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getMapel" })
            });
            const data = await res.json();
            if (data.status === "success") {
                select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
                data.mapel.forEach(m => {
                    select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel} (${m.idMapel})</option>`;
                });
            }
        } catch (e) {
            select.innerHTML = '<option value="">Gagal memuat mapel</option>';
        }
    }

    async function loadDaftarSoal() {
        const idMapel = document.getElementById("selectMapel").value;
        const selectSoal = document.getElementById("selectSoalAda");
        resetFormToTambah();

        if (!idMapel) {
            selectSoal.innerHTML = '<option value="">Pilih Mapel terlebih dahulu...</option>';
            selectSoal.disabled = true;
            return;
        }

        selectSoal.innerHTML = '<option value="">Memuat soal...</option>';
        selectSoal.disabled = true;

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getSoal", idMapel: idMapel })
            });
            const data = await res.json();

            if (data.status === "success" && data.soal.length > 0) {
                listSoalLoaded = data.soal;
                selectSoal.innerHTML = '<option value="">-- Edit Soal yang Ada --</option>';
                data.soal.forEach(s => {
                    selectSoal.innerHTML += `<option value="${s.idSoal}">[${s.idSoal}] ${s.pertanyaan.substring(0, 40)}...</option>`;
                });
                selectSoal.disabled = false;
            } else {
                selectSoal.innerHTML = '<option value="">Belum ada soal untuk mapel ini</option>';
            }
        } catch (e) {
            selectSoal.innerHTML = '<option value="">Gagal mengambil daftar soal</option>';
        }
    }

    function pilihSoalUntukEdit() {
        const selectedId = document.getElementById("selectSoalAda").value;
        if (!selectedId) {
            resetFormToTambah();
            return;
        }

        const soal = listSoalLoaded.find(s => s.idSoal === selectedId);
        if (!soal) return;

        isEditMode = true;
        document.getElementById("formTitle").innerText = "Form Edit Soal";
        document.getElementById("btnSimpan").innerText = "Update / Simpan Perubahan";
        document.getElementById("btnSimpan").className = "btn btn-warning w-100 mt-4 text-white";

        document.getElementById("idSoal").value = soal.idSoal;
        document.getElementById("idSoal").readOnly = true; // ID Soal dikunci saat edit
        document.getElementById("tipeSoal").value = soal.tipe;
        document.getElementById("pertanyaan").value = soal.pertanyaan;

        ubahTipeSoal();

        // Populate Opsi & Kunci
        setTimeout(() => {
            if (soal.tipe === "PG_SEDERHANA" || soal.tipe === "PGK_MCMA") {
                const inputs = document.querySelectorAll(".input-opsi");
                const radioChecks = document.querySelectorAll('input[name="kunciPg"]');
                
                soal.opsi.forEach((op, idx) => {
                    if (inputs[idx]) inputs[idx].value = op;
                    if (radioChecks[idx]) {
                        if (soal.tipe === "PG_SEDERHANA" && op === soal.kunci) {
                            radioChecks[idx].checked = true;
                        } else if (soal.tipe === "PGK_MCMA" && Array.isArray(soal.kunci) && soal.kunci.includes(op)) {
                            radioChecks[idx].checked = true;
                        }
                    }
                });
            } else if (soal.tipe === "PGK_KATEGORI") {
                const statementInputs = document.querySelectorAll(".input-pernyataan");
                const keySelects = document.querySelectorAll(".select-kunci-kat");
                
                soal.opsi.forEach((st, idx) => {
                    if (statementInputs[idx]) statementInputs[idx].value = st;
                    if (keySelects[idx] && soal.kunci && soal.kunci[st]) {
                        keySelects[idx].value = soal.kunci[st];
                    }
                });
            }
        }, 100);
    }

    function resetFormToTambah() {
        isEditMode = false;
        document.getElementById("formTitle").innerText = "Form Input Soal Per Mata Pelajaran";
        document.getElementById("btnSimpan").innerText = "Simpan Soal ke Spreadsheet";
        document.getElementById("btnSimpan").className = "btn btn-success w-100 mt-4";
        document.getElementById("idSoal").readOnly = false;
        document.getElementById("formSoal").reset();
        document.getElementById("selectSoalAda").value = "";
        ubahTipeSoal();
    }

    function ubahTipeSoal() {
        const tipe = document.getElementById("tipeSoal").value;
        const container = document.getElementById("areaOpsi");
        container.innerHTML = "";

        if (tipe === "PG_SEDERHANA" || tipe === "PGK_MCMA") {
            const inputType = tipe === "PG_SEDERHANA" ? "radio" : "checkbox";
            let html = `<label class="form-label font-weight-bold">Opsi Jawaban & Kunci</label>`;
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="input-group mb-2">
                        <div class="input-group-text">
                            <input type="${inputType}" name="kunciPg" value="${i}" ${i === 0 ? 'checked' : ''}>
                        </div>
                        <input type="text" class="form-control input-opsi" placeholder="Opsi ${i + 1}" required>
                    </div>`;
            }
            container.innerHTML = html;
        } else if (tipe === "PGK_KATEGORI") {
            let html = `
                <label class="form-label font-weight-bold">Daftar Pernyataan & Kunci</label>
                <table class="table table-bordered">
                    <thead><tr><th>Pernyataan</th><th width="120">Kunci</th></tr></thead>
                    <tbody>`;
            for (let i = 0; i < 3; i++) {
                html += `
                    <tr>
                        <td><input type="text" class="form-control input-pernyataan" placeholder="Pernyataan ${i + 1}" required></td>
                        <td>
                            <select class="form-select select-kunci-kat">
                                <option value="Benar">Benar</option>
                                <option value="Salah">Salah</option>
                            </select>
                        </td>
                    </tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    }

    async function simpanSoal(e) {
        e.preventDefault();
        const btn = document.getElementById("btnSimpan");
        const msg = document.getElementById("statusMsg");
        const tipe = document.getElementById("tipeSoal").value;
        const idMapel = document.getElementById("selectMapel").value;

        if (!idMapel) {
            alert("Pilih Mata Pelajaran terlebih dahulu!");
            return;
        }

        btn.disabled = true;
        msg.innerHTML = '<span class="text-primary">Menyimpan...</span>';

        let opsiData = [];
        let kunciData = null;

        if (tipe === "PG_SEDERHANA") {
            const opsiInputs = document.querySelectorAll(".input-opsi");
            opsiInputs.forEach(input => opsiData.push(input.value));
            const checkedEl = document.querySelector('input[name="kunciPg"]:checked');
            kunciData = checkedEl ? opsiData[checkedEl.value] : opsiData[0];
        } else if (tipe === "PGK_MCMA") {
            const opsiInputs = document.querySelectorAll(".input-opsi");
            opsiInputs.forEach(input => opsiData.push(input.value));
            kunciData = [];
            document.querySelectorAll('input[name="kunciPg"]:checked').forEach(el => {
                kunciData.push(opsiData[el.value]);
            });
        } else if (tipe === "PGK_KATEGORI") {
            const statementInputs = document.querySelectorAll(".input-pernyataan");
            const keySelects = document.querySelectorAll(".select-kunci-kat");
            kunciData = {};
            statementInputs.forEach((st, idx) => {
                if (st.value.trim() !== "") {
                    opsiData.push(st.value);
                    kunciData[st.value] = keySelects[idx].value;
                }
            });
        }

        const actionType = isEditMode ? "editSoal" : "tambahSoal";

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: actionType,
                    idMapel: idMapel,
                    idSoal: document.getElementById("idSoal").value,
                    tipeSoal: tipe,
                    pertanyaan: document.getElementById("pertanyaan").value,
                    opsi: opsiData,
                    kunci: kunciData
                })
            });
            const data = await res.json();
            if (data.status === "success") {
                msg.innerHTML = `<span class="text-success">${data.message}</span>`;
                loadDaftarSoal();
            } else {
                msg.innerHTML = `<span class="text-danger">${data.message}</span>`;
            }
        } catch (err) {
            msg.innerHTML = '<span class="text-danger">Gagal menghubungi server.</span>';
        } finally {
            btn.disabled = false;
        }
    }

    window.onload = () => {
        loadMapel();
        ubahTipeSoal();
    };
</script>
</body>
</html>
