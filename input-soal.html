<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal LMS - Guru</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .card {
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        .card-header {
            border-top-left-radius: 1rem !important;
            border-top-right-radius: 1rem !important;
            border-bottom: none;
        }
        .badge-tipe {
            font-size: 0.75rem;
            padding: 0.4em 0.8em;
            border-radius: 50rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #094eb3);
            transform: translateY(-1px);
        }
        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-container {
            max-width: 420px;
            margin: 8vh auto;
        }
        .footer {
            margin-top: auto;
            padding: 1.5rem 0;
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="container flex-grow-1 py-4">

    <!-- BAGIAN LOGIN -->
    <div id="login-section" class="login-container fade-in">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-block rounded-circle p-3 mb-3">
                    <i class="bi bi-person-badge fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark">Portal Guru</h3>
                <p class="text-muted small">Silakan login untuk mengelola soal LMS</p>
            </div>
            
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="input-id-guru" placeholder="GURU-01" required>
                <label for="input-id-guru"><i class="bi bi-upc-scan me-2"></i>ID Guru (cth: GURU-01)</label>
            </div>
            
            <button onclick="loginGuru()" id="btnLogin" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Masuk Sekarang
            </button>
            
            <div id="pesan-login" class="text-center mt-3 fw-semibold small"></div>
        </div>
    </div>

    <!-- BAGIAN KELOLA SOAL (Disembunyikan sebelum login) -->
    <div id="main-section" style="display: none;" class="fade-in mx-auto" style="max-width: 900px;">
        
        <!-- HEADER & PILIH MAPEL -->
        <div class="card mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold text-primary mb-0"><i class="bi bi-journal-check me-2"></i>Kelola Soal LMS</h3>
                    <button class="btn btn-outline-danger btn-sm rounded-pill fw-semibold" onclick="logout()">
                        <i class="bi bi-box-arrow-left me-1"></i> Keluar
                    </button>
                </div>
                <div class="p-3 bg-light rounded-3 border">
                    <label class="form-label fw-semibold text-secondary"><i class="bi bi-book me-1"></i> Pilih Mata Pelajaran</label>
                    <select id="selectMapel" class="form-select form-select-lg border-primary shadow-sm" onchange="loadDaftarSoal()" required>
                        <option value="">-- Menunggu Data Mapel --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- FORM INPUT / EDIT SOAL -->
        <div class="card mb-4" id="cardFormSoal">
            <div class="card-header bg-primary text-white d-flex flex-wrap justify-content-between align-items-center py-3 px-4">
                <h5 class="mb-0 fw-bold" id="formTitle"><i class="bi bi-plus-circle-fill me-2"></i>Form Tambah Soal</h5>
                <button class="btn btn-sm btn-light fw-semibold text-primary mt-2 mt-md-0 shadow-sm" id="btnResetForm" onclick="resetFormToTambah()">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Reset / Tambah Baru
                </button>
            </div>
            <div class="card-body p-4 p-md-5">
                <form id="formSoal" onsubmit="simpanSoal(event)">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold text-secondary">ID Soal</label>
                            <input type="text" id="idSoal" class="form-control bg-light" placeholder="Contoh: S1, S2, S3" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold text-secondary">Tipe Soal</label>
                            <select id="tipeSoal" class="form-select bg-light" onchange="ubahTipeSoal()" required>
                                <option value="PG_SEDERHANA">Pilihan Ganda Sederhana (1 Jawaban Benar)</option>
                                <option value="PGK_MCMA">PGK MCMA (Bisa Lebih Dari 1 Jawaban Benar)</option>
                                <option value="PGK_KATEGORI">PGK Kategori (Pernyataan Benar / Salah)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 mb-4">
                        <label class="form-label fw-semibold text-secondary">Pertanyaan / Pokok Soal</label>
                        <textarea id="pertanyaan" class="form-control" rows="4" placeholder="Ketik pertanyaan di sini..." required></textarea>
                    </div>

                    <!-- DYNAMIC AREA OPSI -->
                    <div id="areaOpsi" class="mb-4 p-3 border rounded-3 bg-light"></div>
                    
                    <div class="d-flex gap-2 mt-4 pt-2">
                        <button type="submit" id="btnSimpan" class="btn btn-success flex-grow-1 fw-bold py-2 shadow-sm">
                            <i class="bi bi-save2 me-1"></i> Simpan Soal
                        </button>
                        <button type="button" id="btnHapusForm" class="btn btn-danger d-none fw-bold py-2 px-4 shadow-sm" onclick="hapusSoalDariForm()">
                            <i class="bi bi-trash3 me-1"></i> Hapus
                        </button>
                    </div>
                </form>
                <div id="statusMsg" class="mt-3 text-center fw-semibold"></div>
            </div>
        </div>

        <!-- DAFTAR SOAL TERSEDIA -->
        <div class="card">
            <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-task me-2 text-primary"></i>Daftar Soal Tersedia</h5>
                <span class="badge bg-primary rounded-pill px-3 py-2 shadow-sm" id="jumlahSoalBadge">0 Soal</span>
            </div>
            <div class="card-body p-4 p-md-5 bg-light">
                <div id="containerDaftarSoal">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-arrow-up-circle fs-1 d-block mb-3 text-secondary opacity-50"></i>
                        Pilih Mata Pelajaran di atas untuk melihat daftar soal.
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer class="footer text-center">
    <div class="container text-muted small fw-medium">
        &copy; 2024 LMS Portal Guru.<br>
        Developed with <i class="bi bi-code-slash text-primary mx-1"></i> by 
        <a href="https://github.com/kang-ngopi404" target="_blank" class="text-decoration-none text-dark fw-bold hover-primary">
            <i class="bi bi-github"></i> kang_ngopi404
        </a>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbymaT_q0huDXs9L6JdNhGJdkZp2OE2e-FFJHS_gll5mbY6DuM2GwegABc2_C37ywab1/exec";

    let listSoalLoaded = [];
    let isEditMode = false;

    // --- LOGIKA LOGIN ---
    function loginGuru() {
        const idGuru = document.getElementById("input-id-guru").value.trim();
        const pesanLogin = document.getElementById("pesan-login");
        const btnLogin = document.getElementById("btnLogin");

        if (!idGuru) {
            pesanLogin.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> ID Guru tidak boleh kosong!';
            pesanLogin.className = "text-center mt-3 fw-semibold small text-danger";
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memeriksa...';
        pesanLogin.innerHTML = 'Mengecek otorisasi ID...';
        pesanLogin.className = "text-center mt-3 fw-semibold small text-primary";

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getMapelGuru', idGuru: idGuru })
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === 'success') {
                // Sembunyikan form login, tampilkan area utama
                document.getElementById("login-section").style.display = "none";
                document.getElementById("main-section").style.display = "block";

                // Masukkan data ke dalam select box (Pastikan ID-nya benar: selectMapel)
                const selectMapel = document.getElementById("selectMapel");
                selectMapel.innerHTML = '<option value="">-- Silakan Pilih Mapel --</option>'; 
                
                res.data.forEach(m => {
                    const option = document.createElement("option");
                    option.value = m.idMapel;
                    option.text = `${m.namaMapel} (${m.idMapel})`;
                    selectMapel.appendChild(option);
                });
                
                // Set default tipe soal 
                ubahTipeSoal();
            } else {
                pesanLogin.innerHTML = `<i class="bi bi-x-circle-fill"></i> ${res.message}`;
                pesanLogin.className = "text-center mt-3 fw-semibold small text-danger";
            }
        })
        .catch(err => {
            pesanLogin.innerHTML = '<i class="bi bi-wifi-off"></i> Terjadi kesalahan jaringan!';
            pesanLogin.className = "text-center mt-3 fw-semibold small text-danger";
        })
        .finally(() => {
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Masuk Sekarang';
        });
    }

    function logout() {
        if(confirm('Apakah Anda yakin ingin keluar?')) {
            // Reset UI
            document.getElementById("login-section").style.display = "block";
            document.getElementById("main-section").style.display = "none";
            document.getElementById("input-id-guru").value = "";
            document.getElementById("pesan-login").innerHTML = "";
            document.getElementById("selectMapel").innerHTML = '<option value="">-- Menunggu Data Mapel --</option>';
            document.getElementById("containerDaftarSoal").innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="bi bi-arrow-up-circle fs-1 d-block mb-3 text-secondary opacity-50"></i>
                    Pilih Mata Pelajaran di atas untuk melihat daftar soal.
                </div>`;
            document.getElementById("jumlahSoalBadge").innerText = "0 Soal";
            resetFormToTambah();
        }
    }


    // --- LOGIKA KELOLA SOAL (Hanya dieksekusi SETELAH login) ---
    async function loadDaftarSoal() {
        const idMapel = document.getElementById("selectMapel").value;
        const container = document.getElementById("containerDaftarSoal");
        const badge = document.getElementById("jumlahSoalBadge");
        resetFormToTambah();

        if (!idMapel) {
            container.innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="bi bi-arrow-up-circle fs-1 d-block mb-3 text-secondary opacity-50"></i>
                    Pilih Mata Pelajaran di atas untuk melihat daftar soal.
                </div>`;
            badge.innerText = "0 Soal";
            return;
        }

        container.innerHTML = `
            <div class="text-center py-5 text-primary">
                <div class="spinner-border mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
                <h6 class="fw-semibold">Mencari soal ke server...</h6>
            </div>`;

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getSoal", idMapel: idMapel })
            });
            const data = await res.json();

            if (data.status === "success" && data.soal.length > 0) {
                listSoalLoaded = data.soal;
                badge.innerText = `${data.soal.length} Soal`;
                renderDaftarSoal(data.soal);
            } else {
                listSoalLoaded = [];
                badge.innerText = "0 Soal";
                container.innerHTML = `
                    <div class="text-center text-muted py-5">
                        <div class="bg-white rounded-circle d-inline-block p-4 mb-3 shadow-sm">
                            <i class="bi bi-inbox fs-1 text-secondary opacity-50"></i>
                        </div>
                        <h6 class="fw-semibold">Belum ada soal untuk mata pelajaran ini.</h6>
                    </div>`;
            }
        } catch (e) {
            container.innerHTML = '<div class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle fs-2 d-block mb-2"></i>Gagal mengambil daftar soal dari server.</div>';
        }
    }

    function renderDaftarSoal(soalArray) {
        const container = document.getElementById("containerDaftarSoal");
        let html = "";

        soalArray.forEach((s, idx) => {
            let labelTipe = "";
            let badgeClass = "bg-primary";
            
            if (s.tipe === "PG_SEDERHANA") {
                labelTipe = "PG Sederhana"; badgeClass = "bg-primary";
            } else if (s.tipe === "PGK_MCMA") {
                labelTipe = "PGK (Multi)"; badgeClass = "bg-info text-dark";
            } else if (s.tipe === "PGK_KATEGORI") {
                labelTipe = "PGK (B/S)"; badgeClass = "bg-warning text-dark";
            }

            html += `
                <div class="card mb-4 border-0 shadow-sm rounded-4 overflow-hidden fade-in">
                    <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                        <div>
                            <span class="fw-bold fs-5 me-2 text-primary">#${s.idSoal}</span>
                            <span class="badge ${badgeClass} badge-tipe">${labelTipe}</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-primary fw-semibold px-3" onclick="pilihSoalUntukEditById('${s.idSoal}')">
                                <i class="bi bi-pencil-square me-1"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-outline-danger fw-semibold px-3" onclick="hapusSoalDirect('${s.idSoal}')">
                                <i class="bi bi-trash me-1"></i> Hapus
                            </button>
                        </div>
                    </div>
                    <div class="card-body bg-white p-4">
                        <p class="card-text fw-semibold text-dark fs-5 mb-4">${s.pertanyaan}</p>
                        <div class="bg-light p-3 rounded-3 border">
                            ${renderDetailOpsi(s)}
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    }

    function renderDetailOpsi(soal) {
        let html = '<ul class="list-group list-group-flush small bg-transparent">';
        if (soal.tipe === "PG_SEDERHANA" || soal.tipe === "PGK_MCMA") {
            soal.opsi.forEach(op => {
                let isKunci = false;
                if (soal.tipe === "PG_SEDERHANA" && op === soal.kunci) isKunci = true;
                if (soal.tipe === "PGK_MCMA" && Array.isArray(soal.kunci) && soal.kunci.includes(op)) isKunci = true;

                html += `
                    <li class="list-group-item bg-transparent px-0 py-2 border-0 ${isKunci ? 'fw-bold text-success' : 'text-secondary'}">
                        <i class="bi ${isKunci ? 'bi-check-circle-fill fs-5 me-2 align-middle' : 'bi-circle fs-5 me-2 align-middle'}"></i>
                        <span class="align-middle fs-6">${op}</span>
                        ${isKunci ? '<span class="badge bg-success ms-2 rounded-pill">Jawaban Benar</span>' : ''}
                    </li>`;
            });
        } else if (soal.tipe === "PGK_KATEGORI") {
            soal.opsi.forEach(st => {
                const kunciVal = (soal.kunci && soal.kunci[st]) ? soal.kunci[st] : "-";
                const isBenar = kunciVal.toLowerCase() === 'benar';
                html += `
                    <li class="list-group-item bg-transparent px-0 py-2 border-bottom border-light d-flex justify-content-between align-items-center text-secondary fs-6">
                        <span><i class="bi bi-arrow-right-short me-1 text-primary"></i>${st}</span>
                        <span class="badge ${isBenar ? 'bg-success' : 'bg-danger'} rounded-pill px-3">${kunciVal}</span>
                    </li>`;
            });
        }
        html += '</ul>';
        return html;
    }

    function pilihSoalUntukEditById(idSoal) {
        const soal = listSoalLoaded.find(s => s.idSoal === idSoal);
        if (!soal) return;

        isEditMode = true;
        document.getElementById("formTitle").innerHTML = `<i class="bi bi-pencil-square me-2"></i>Edit Soal <span class="text-warning">[${soal.idSoal}]</span>`;
        document.getElementById("btnSimpan").innerHTML = '<i class="bi bi-arrow-repeat me-2"></i> Update Soal';
        document.getElementById("btnSimpan").className = "btn btn-warning flex-grow-1 text-dark fw-bold py-2 shadow-sm";
        document.getElementById("btnHapusForm").classList.remove("d-none");

        document.getElementById("idSoal").value = soal.idSoal;
        document.getElementById("idSoal").readOnly = true;
        document.getElementById("tipeSoal").value = soal.tipe;
        document.getElementById("pertanyaan").value = soal.pertanyaan;

        ubahTipeSoal();

        setTimeout(() => {
            if (soal.tipe === "PG_SEDERHANA" || soal.tipe === "PGK_MCMA") {
                const inputs = document.querySelectorAll(".input-opsi");
                const radioChecks = document.querySelectorAll('input[name="kunciPg"]');
                soal.opsi.forEach((op, idx) => {
                    if (inputs[idx]) inputs[idx].value = op;
                    if (radioChecks[idx]) {
                        if (soal.tipe === "PG_SEDERHANA" && op === soal.kunci) {
                            radioChecks[idx].checked = true;
                        } else if (soal.tipe === "PGK_MCMA" && Array.isArray(soal.kunci) && soal.kunci.includes(op)) {
                            radioChecks[idx].checked = true;
                        }
                    }
                });
            } else if (soal.tipe === "PGK_KATEGORI") {
                const statementInputs = document.querySelectorAll(".input-pernyataan");
                const keySelects = document.querySelectorAll(".select-kunci-kat");
                soal.opsi.forEach((st, idx) => {
                    if (statementInputs[idx]) statementInputs[idx].value = st;
                    if (keySelects[idx] && soal.kunci && soal.kunci[st]) {
                        keySelects[idx].value = soal.kunci[st];
                    }
                });
            }
        }, 100);

        // Scroll
        document.getElementById("cardFormSoal").scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetFormToTambah() {
        isEditMode = false;
        document.getElementById("formTitle").innerHTML = '<i class="bi bi-plus-circle-fill me-2"></i>Form Tambah Soal';
        document.getElementById("btnSimpan").innerHTML = '<i class="bi bi-save2 me-2"></i> Simpan Soal Baru';
        document.getElementById("btnSimpan").className = "btn btn-success flex-grow-1 fw-bold py-2 shadow-sm";
        document.getElementById("btnHapusForm").classList.add("d-none");
        document.getElementById("idSoal").readOnly = false;
        document.getElementById("formSoal").reset();
        document.getElementById("statusMsg").innerHTML = "";
        ubahTipeSoal();
    }

    function ubahTipeSoal() {
        const tipe = document.getElementById("tipeSoal").value;
        const container = document.getElementById("areaOpsi");
        container.innerHTML = "";

        if (tipe === "PG_SEDERHANA" || tipe === "PGK_MCMA") {
            const inputType = tipe === "PG_SEDERHANA" ? "radio" : "checkbox";
            let html = `<label class="form-label fw-bold text-dark mb-3"><i class="bi bi-ui-radios me-2 text-primary"></i>Opsi Jawaban & Kunci (Pilih yang Benar)</label>`;
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="input-group mb-3 shadow-sm rounded">
                        <div class="input-group-text bg-white border-end-0">
                            <input class="form-check-input mt-0" type="${inputType}" name="kunciPg" value="${i}" ${i === 0 ? 'checked' : ''}>
                        </div>
                        <input type="text" class="form-control border-start-0 ps-0" placeholder="Ketik opsi ke-${i + 1}..." required>
                    </div>`;
            }
            container.innerHTML = html;
        } else if (tipe === "PGK_KATEGORI") {
            let html = `
                <label class="form-label fw-bold text-dark mb-3"><i class="bi bi-table me-2 text-primary"></i>Daftar Pernyataan & Kunci B/S</label>
                <div class="table-responsive rounded shadow-sm border">
                    <table class="table table-borderless table-striped mb-0 align-middle">
                        <thead class="bg-primary text-white"><tr><th class="py-3 ps-3">Pernyataan</th><th width="160" class="py-3">Kunci</th></tr></thead>
                        <tbody>`;
            for (let i = 0; i < 3; i++) {
                html += `
                    <tr>
                        <td class="ps-3"><input type="text" class="form-control" placeholder="Pernyataan ${i + 1}" required></td>
                        <td>
                            <select class="form-select select-kunci-kat fw-semibold">
                                <option value="Benar">Benar</option>
                                <option value="Salah">Salah</option>
                            </select>
                        </td>
                    </tr>`;
            }
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }
    }

    async function simpanSoal(e) {
        e.preventDefault();
        const btnSimpan = document.getElementById("btnSimpan");
        const btnHapus = document.getElementById("btnHapusForm");
        const msg = document.getElementById("statusMsg");
        const tipe = document.getElementById("tipeSoal").value;
        const idMapel = document.getElementById("selectMapel").value;

        if (!idMapel) {
            alert("Pilih Mata Pelajaran terlebih dahulu di bagian atas!");
            document.getElementById("selectMapel").focus();
            return;
        }

        btnSimpan.disabled = true;
        btnHapus.disabled = true;
        msg.innerHTML = '<span class="text-primary fw-bold"><div class="spinner-border spinner-border-sm me-2" role="status"></div> Mengirim data ke server...</span>';

        let opsiData = [];
        let kunciData = null;

        if (tipe === "PG_SEDERHANA" || tipe === "PGK_MCMA") {
            const opsiInputs = document.querySelectorAll("#areaOpsi input[type='text']");
            opsiInputs.forEach(input => opsiData.push(input.value));
            
            if (tipe === "PG_SEDERHANA") {
                const checkedEl = document.querySelector('input[name="kunciPg"]:checked');
                kunciData = checkedEl ? opsiData[checkedEl.value] : opsiData[0];
            } else {
                kunciData = [];
                document.querySelectorAll('input[name="kunciPg"]:checked').forEach(el => {
                    kunciData.push(opsiData[el.value]);
                });
            }
        } else if (tipe === "PGK_KATEGORI") {
            const statementInputs = document.querySelectorAll(".form-control[placeholder^='Pernyataan']");
            const keySelects = document.querySelectorAll(".select-kunci-kat");
            kunciData = {};
            statementInputs.forEach((st, idx) => {
                if (st.value.trim() !== "") {
                    opsiData.push(st.value);
                    kunciData[st.value] = keySelects[idx].value;
                }
            });
        }

        const actionType = isEditMode ? "editSoal" : "tambahSoal";

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: actionType,
                    idMapel: idMapel,
                    idSoal: document.getElementById("idSoal").value,
                    tipeSoal: tipe,
                    pertanyaan: document.getElementById("pertanyaan").value,
                    opsi: opsiData,
                    kunci: kunciData
                })
            });
            const data = await res.json();
            if (data.status === "success") {
                msg.innerHTML = `<div class="alert alert-success py-2 mt-2"><i class="bi bi-check-circle-fill me-2"></i>${data.message}</div>`;
                resetFormToTambah();
                loadDaftarSoal();
                setTimeout(() => msg.innerHTML = "", 4000);
            } else {
                msg.innerHTML = `<div class="alert alert-danger py-2 mt-2"><i class="bi bi-x-circle-fill me-2"></i>${data.message}</div>`;
            }
        } catch (err) {
            msg.innerHTML = '<div class="alert alert-danger py-2 mt-2"><i class="bi bi-wifi-off me-2"></i>Gagal menghubungi server.</div>';
        } finally {
            btnSimpan.disabled = false;
            btnHapus.disabled = false;
        }
    }

    function hapusSoalDariForm() {
        const idSoal = document.getElementById("idSoal").value;
        if (idSoal) hapusSoalProcess(idSoal);
    }

    function hapusSoalDirect(idSoal) {
        if (idSoal) hapusSoalProcess(idSoal);
    }

    async function hapusSoalProcess(idSoalTarget) {
        const idMapel = document.getElementById("selectMapel").value;
        if (!idMapel || !idSoalTarget) return;
        if (!confirm(`Tindakan ini tidak bisa dibatalkan! Yakin menghapus soal [${idSoalTarget}]?`)) return;

        const msg = document.getElementById("statusMsg");
        msg.innerHTML = '<span class="text-danger fw-bold"><div class="spinner-border spinner-border-sm me-2" role="status"></div> Menghapus soal...</span>';

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "hapusSoal", idMapel: idMapel, idSoal: idSoalTarget })
            });
            const data = await res.json();
            if (data.status === "success") {
                resetFormToTambah();
                loadDaftarSoal();
                msg.innerHTML = `<div class="alert alert-success py-2 mt-2"><i class="bi bi-check-circle-fill me-2"></i>${data.message}</div>`;
                setTimeout(() => msg.innerHTML = "", 4000);
            } else {
                alert(`Gagal: ${data.message}`);
                msg.innerHTML = "";
            }
        } catch (err) {
            alert('Gagal menghubungi server.');
            msg.innerHTML = "";
        }
    }
</script>
</body>
</html>
