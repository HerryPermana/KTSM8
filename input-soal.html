<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal LMS - Guru</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 0.75rem;
        }
        .badge-tipe {
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 900px;">
    
    <!-- HEADER & PILIH MAPEL -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body p-4">
            <h3 class="fw-bold text-primary mb-3"><i class="bi bi-journal-text me-2"></i>Kelola Soal LMS</h3>
            <div>
                <label class="form-label fw-semibold">Pilih Mata Pelajaran</label>
                <select id="selectMapel" class="form-select form-select-lg" onchange="loadDaftarSoal()" required>
                    <option value="">Memuat Mapel...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- FORM INPUT / EDIT SOAL -->
    <div class="card shadow-sm mb-4 border-0" id="cardFormSoal">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold" id="formTitle"><i class="bi bi-plus-circle me-2"></i>Form Tambah Soal</h5>
            <button class="btn btn-sm btn-light fw-semibold" id="btnResetForm" onclick="resetFormToTambah()">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Reset / Tambah Soal Baru
            </button>
        </div>
        <div class="card-body p-4">
            <form id="formSoal" onsubmit="simpanSoal(event)">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">ID Soal</label>
                        <input type="text" id="idSoal" class="form-control" placeholder="Contoh: S1, S2, S3" required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-semibold">Tipe Soal</label>
                        <select id="tipeSoal" class="form-select" onchange="ubahTipeSoal()" required>
                            <option value="PG_SEDERHANA">Pilihan Ganda Sederhana (1 Jawaban Benar)</option>
                            <option value="PGK_MCMA">PGK MCMA (Bisa Lebih Dari 1 Jawaban Benar)</option>
                            <option value="PGK_KATEGORI">PGK Kategori (Pernyataan Benar / Salah)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Pertanyaan / Pokok Soal</label>
                    <textarea id="pertanyaan" class="form-control" rows="3" placeholder="Tuliskan pertanyaan..." required></textarea>
                </div>

                <!-- DYNAMIC AREA OPSI -->
                <div id="areaOpsi" class="mb-3"></div>
                
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" id="btnSimpan" class="btn btn-success flex-grow-1 fw-semibold py-2">
                        <i class="bi bi-save me-1"></i> Simpan Soal Baru
                    </button>
                    <button type="button" id="btnHapusForm" class="btn btn-danger d-none fw-semibold py-2 px-4" onclick="hapusSoalDariForm()">
                        <i class="bi bi-trash me-1"></i> Hapus Soal
                    </button>
                </div>
            </form>
            <div id="statusMsg" class="mt-3 text-center fw-semibold"></div>
        </div>
    </div>

    <!-- DAFTAR SOAL TERSEDIA -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-task me-2 text-primary"></i>Daftar Soal Tersedia</h5>
            <span class="badge bg-secondary" id="jumlahSoalBadge">0 Soal</span>
        </div>
        <div class="card-body p-4">
            <div id="containerDaftarSoal">
                <div class="text-center text-muted py-4">
                    <i class="bi bi-arrow-up-circle fs-2 d-block mb-2"></i>
                    Pilih Mata Pelajaran di atas untuk melihat daftar soal.
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxWaueTt2s1Mt_S8eI1QeaZKOvf8dS_khQRPVPzKTqPfmCYMgcP3Qcv_obHFyPW5Yza/exec";

    let listSoalLoaded = [];
    let isEditMode = false;

    // 1. Load Daftar Mapel saat halaman dimuat
    async function loadMapel() {
        const select = document.getElementById("selectMapel");
        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getMapel" })
            });
            const data = await res.json();
            if (data.status === "success") {
                select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
                data.mapel.forEach(m => {
                    select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel} (${m.idMapel})</option>`;
                });
            }
        } catch (e) {
            select.innerHTML = '<option value="">Gagal memuat mapel</option>';
        }
    }

    // 2. Load Daftar Soal berdasarkan Mapel yang dipilih
    async function loadDaftarSoal() {
        const idMapel = document.getElementById("selectMapel").value;
        const container = document.getElementById("containerDaftarSoal");
        const badge = document.getElementById("jumlahSoalBadge");
        resetFormToTambah();

        if (!idMapel) {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="bi bi-arrow-up-circle fs-2 d-block mb-2"></i>
                    Pilih Mata Pelajaran di atas untuk melihat daftar soal.
                </div>`;
            badge.innerText = "0 Soal";
            return;
        }

        container.innerHTML = `
            <div class="text-center py-4 text-primary">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                Memuat daftar soal...
            </div>`;

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getSoal", idMapel: idMapel })
            });
            const data = await res.json();

            if (data.status === "success" && data.soal.length > 0) {
                listSoalLoaded = data.soal;
                badge.innerText = `${data.soal.length} Soal`;
                renderDaftarSoal(data.soal);
            } else {
                listSoalLoaded = [];
                badge.innerText = "0 Soal";
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        Belum ada soal untuk mata pelajaran ini.
                    </div>`;
            }
        } catch (e) {
            container.innerHTML = '<div class="text-center text-danger py-4">Gagal mengambil daftar soal dari server.</div>';
        }
    }

    // 3. Render list soal ke tampilan Card
    function renderDaftarSoal(soalArray) {
        const container = document.getElementById("containerDaftarSoal");
        let html = "";

        soalArray.forEach((s, idx) => {
            let labelTipe = "";
            let badgeClass = "bg-primary";
            
            if (s.tipe === "PG_SEDERHANA") {
                labelTipe = "PG Sederhana";
                badgeClass = "bg-primary";
            } else if (s.tipe === "PGK_MCMA") {
                labelTipe = "PGK (Multi Jawaban)";
                badgeClass = "bg-info text-dark";
            } else if (s.tipe === "PGK_KATEGORI") {
                labelTipe = "PGK (Benar/Salah)";
                badgeClass = "bg-warning text-dark";
            }

            html += `
                <div class="card mb-3 border">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
                        <div>
                            <span class="fw-bold me-2">#${s.idSoal}</span>
                            <span class="badge ${badgeClass} badge-tipe">${labelTipe}</span>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="pilihSoalUntukEditById('${s.idSoal}')">
                                <i class="bi bi-pencil me-1"></i>Edit
                            </button>
                            <button class="btn btn-outline-danger" onclick="hapusSoalDirect('${s.idSoal}')">
                                <i class="bi bi-trash me-1"></i>Hapus
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="card-text fw-semibold mb-3">${s.pertanyaan}</p>
                        ${renderDetailOpsi(s)}
                    </div>
                </div>`;
        });

        container.innerHTML = html;
    }

    // Helper: Render opsi & kunci pada card daftar soal
    function renderDetailOpsi(soal) {
        let html = '<ul class="list-group list-group-flush small">';
        if (soal.tipe === "PG_SEDERHANA" || soal.tipe === "PGK_MCMA") {
            soal.opsi.forEach(op => {
                let isKunci = false;
                if (soal.tipe === "PG_SEDERHANA" && op === soal.kunci) isKunci = true;
                if (soal.tipe === "PGK_MCMA" && Array.isArray(soal.kunci) && soal.kunci.includes(op)) isKunci = true;

                html += `
                    <li class="list-group-item px-0 py-1 border-0 ${isKunci ? 'fw-bold text-success' : 'text-secondary'}">
                        <i class="bi ${isKunci ? 'bi-check-circle-fill text-success' : 'bi-circle'} me-2"></i>${op}
                        ${isKunci ? '<span class="badge bg-success-subtle text-success border border-success ms-2">Kunci</span>' : ''}
                    </li>`;
            });
        } else if (soal.tipe === "PGK_KATEGORI") {
            soal.opsi.forEach(st => {
                const kunciVal = (soal.kunci && soal.kunci[st]) ? soal.kunci[st] : "-";
                html += `
                    <li class="list-group-item px-0 py-1 border-0 d-flex justify-content-between text-secondary">
                        <span><i class="bi bi-dot me-1"></i>${st}</span>
                        <span class="badge bg-secondary">${kunciVal}</span>
                    </li>`;
            });
        }
        html += '</ul>';
        return html;
    }

    // 4. Pilih soal untuk diedit via ID
    function pilihSoalUntukEditById(idSoal) {
        const soal = listSoalLoaded.find(s => s.idSoal === idSoal);
        if (!soal) return;

        isEditMode = true;
        document.getElementById("formTitle").innerHTML = `<i class="bi bi-pencil-square me-2"></i>Form Edit Soal [${soal.idSoal}]`;
        document.getElementById("btnSimpan").innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Update / Simpan Perubahan';
        document.getElementById("btnSimpan").className = "btn btn-warning flex-grow-1 text-white fw-semibold py-2";
        
        document.getElementById("btnHapusForm").classList.remove("d-none");

        document.getElementById("idSoal").value = soal.idSoal;
        document.getElementById("idSoal").readOnly = true;
        document.getElementById("tipeSoal").value = soal.tipe;
        document.getElementById("pertanyaan").value = soal.pertanyaan;

        ubahTipeSoal();

        // Populate Opsi & Kunci
        setTimeout(() => {
            if (soal.tipe === "PG_SEDERHANA" || soal.tipe === "PGK_MCMA") {
                const inputs = document.querySelectorAll(".input-opsi");
                const radioChecks = document.querySelectorAll('input[name="kunciPg"]');
                
                soal.opsi.forEach((op, idx) => {
                    if (inputs[idx]) inputs[idx].value = op;
                    if (radioChecks[idx]) {
                        if (soal.tipe === "PG_SEDERHANA" && op === soal.kunci) {
                            radioChecks[idx].checked = true;
                        } else if (soal.tipe === "PGK_MCMA" && Array.isArray(soal.kunci) && soal.kunci.includes(op)) {
                            radioChecks[idx].checked = true;
                        }
                    }
                });
            } else if (soal.tipe === "PGK_KATEGORI") {
                const statementInputs = document.querySelectorAll(".input-pernyataan");
                const keySelects = document.querySelectorAll(".select-kunci-kat");
                
                soal.opsi.forEach((st, idx) => {
                    if (statementInputs[idx]) statementInputs[idx].value = st;
                    if (keySelects[idx] && soal.kunci && soal.kunci[st]) {
                        keySelects[idx].value = soal.kunci[st];
                    }
                });
            }
        }, 100);

        // Scroll halus ke area Form
        document.getElementById("cardFormSoal").scrollIntoView({ behavior: 'smooth' });
    }

    // 5. Reset Form ke Mode Tambah Soal
    function resetFormToTambah() {
        isEditMode = false;
        document.getElementById("formTitle").innerHTML = '<i class="bi bi-plus-circle me-2"></i>Form Tambah Soal';
        document.getElementById("btnSimpan").innerHTML = '<i class="bi bi-save me-1"></i> Simpan Soal Baru';
        document.getElementById("btnSimpan").className = "btn btn-success flex-grow-1 fw-semibold py-2";
        
        document.getElementById("btnHapusForm").classList.add("d-none");

        document.getElementById("idSoal").readOnly = false;
        document.getElementById("formSoal").reset();
        document.getElementById("statusMsg").innerHTML = "";
        ubahTipeSoal();
    }

    // 6. Merubah elemen Opsi Jawaban berdasarkan Tipe Soal
    function ubahTipeSoal() {
        const tipe = document.getElementById("tipeSoal").value;
        const container = document.getElementById("areaOpsi");
        container.innerHTML = "";

        if (tipe === "PG_SEDERHANA" || tipe === "PGK_MCMA") {
            const inputType = tipe === "PG_SEDERHANA" ? "radio" : "checkbox";
            let html = `<label class="form-label fw-semibold">Opsi Jawaban & Kunci</label>`;
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="input-group mb-2">
                        <div class="input-group-text">
                            <input type="${inputType}" name="kunciPg" value="${i}" ${i === 0 ? 'checked' : ''}>
                        </div>
                        <input type="text" class="form-control input-opsi" placeholder="Opsi ${i + 1}" required>
                    </div>`;
            }
            container.innerHTML = html;
        } else if (tipe === "PGK_KATEGORI") {
            let html = `
                <label class="form-label fw-semibold">Daftar Pernyataan & Kunci</label>
                <div class="table-responsive">
                    <table class="table table-bordered mb-0 align-middle">
                        <thead class="table-light"><tr><th>Pernyataan</th><th width="140">Kunci</th></tr></thead>
                        <tbody>`;
            for (let i = 0; i < 3; i++) {
                html += `
                    <tr>
                        <td><input type="text" class="form-control input-pernyataan" placeholder="Pernyataan ${i + 1}" required></td>
                        <td>
                            <select class="form-select select-kunci-kat">
                                <option value="Benar">Benar</option>
                                <option value="Salah">Salah</option>
                            </select>
                        </td>
                    </tr>`;
            }
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }
    }

    // 7. Simpan / Update Soal
    async function simpanSoal(e) {
        e.preventDefault();
        const btnSimpan = document.getElementById("btnSimpan");
        const btnHapus = document.getElementById("btnHapusForm");
        const msg = document.getElementById("statusMsg");
        const tipe = document.getElementById("tipeSoal").value;
        const idMapel = document.getElementById("selectMapel").value;

        if (!idMapel) {
            alert("Pilih Mata Pelajaran terlebih dahulu!");
            return;
        }

        btnSimpan.disabled = true;
        btnHapus.disabled = true;
        msg.innerHTML = '<span class="text-primary"><div class="spinner-border spinner-border-sm me-1" role="status"></div> Menyimpan data...</span>';

        let opsiData = [];
        let kunciData = null;

        if (tipe === "PG_SEDERHANA") {
            const opsiInputs = document.querySelectorAll(".input-opsi");
            opsiInputs.forEach(input => opsiData.push(input.value));
            const checkedEl = document.querySelector('input[name="kunciPg"]:checked');
            kunciData = checkedEl ? opsiData[checkedEl.value] : opsiData[0];
        } else if (tipe === "PGK_MCMA") {
            const opsiInputs = document.querySelectorAll(".input-opsi");
            opsiInputs.forEach(input => opsiData.push(input.value));
            kunciData = [];
            document.querySelectorAll('input[name="kunciPg"]:checked').forEach(el => {
                kunciData.push(opsiData[el.value]);
            });
        } else if (tipe === "PGK_KATEGORI") {
            const statementInputs = document.querySelectorAll(".input-pernyataan");
            const keySelects = document.querySelectorAll(".select-kunci-kat");
            kunciData = {};
            statementInputs.forEach((st, idx) => {
                if (st.value.trim() !== "") {
                    opsiData.push(st.value);
                    kunciData[st.value] = keySelects[idx].value;
                }
            });
        }

        const actionType = isEditMode ? "editSoal" : "tambahSoal";

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: actionType,
                    idMapel: idMapel,
                    idSoal: document.getElementById("idSoal").value,
                    tipeSoal: tipe,
                    pertanyaan: document.getElementById("pertanyaan").value,
                    opsi: opsiData,
                    kunci: kunciData
                })
            });
            const data = await res.json();
            if (data.status === "success") {
                msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>${data.message}</span>`;
                resetFormToTambah();
                loadDaftarSoal();
            } else {
                msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${data.message}</span>`;
            }
        } catch (err) {
            msg.innerHTML = '<span class="text-danger">Gagal menghubungi server.</span>';
        } finally {
            btnSimpan.disabled = false;
            btnHapus.disabled = false;
        }
    }

    // 8. Function Hapus dari Form Edit
    function hapusSoalDariForm() {
        const idSoal = document.getElementById("idSoal").value;
        if (idSoal) hapusSoalProcess(idSoal);
    }

    // 9. Function Hapus langsung dari tombol Card
    function hapusSoalDirect(idSoal) {
        if (idSoal) hapusSoalProcess(idSoal);
    }

    // 10. Eksekusi Hapus Soal ke Server
    async function hapusSoalProcess(idSoalTarget) {
        const idMapel = document.getElementById("selectMapel").value;
        if (!idMapel || !idSoalTarget) return;

        if (!confirm(`Apakah Anda yakin ingin menghapus soal [${idSoalTarget}]?`)) return;

        const btnSimpan = document.getElementById("btnSimpan");
        const btnHapus = document.getElementById("btnHapusForm");
        const msg = document.getElementById("statusMsg");

        btnSimpan.disabled = true;
        btnHapus.disabled = true;
        msg.innerHTML = '<span class="text-danger"><div class="spinner-border spinner-border-sm me-1" role="status"></div> Menghapus soal...</span>';

        try {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "hapusSoal",
                    idMapel: idMapel,
                    idSoal: idSoalTarget
                })
            });
            const data = await res.json();
            if (data.status === "success") {
                msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>${data.message}</span>`;
                resetFormToTambah();
                loadDaftarSoal();
            } else {
                msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${data.message}</span>`;
            }
        } catch (err) {
            msg.innerHTML = '<span class="text-danger">Gagal menghubungi server.</span>';
        } finally {
            btnSimpan.disabled = false;
            btnHapus.disabled = false;
        }
    }

    window.onload = () => {
        loadMapel();
        ubahTipeSoal();
    };
</script>
</body>
</html>
